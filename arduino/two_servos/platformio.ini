; PlatformIO project for an Arduino UNO R4 WiFi + ROBOTIS DYNAMIXEL Shield driving two DYNAMIXELs (IDs 1 and 2).
; Build/upload/monitor from the PlatformIO toolbar in VS Code, or:
;   pio run -t upload && pio device monitor

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi       ; USB VID 2341 / PID 1002 (Renesas RA4M1; the on-board ESP32-S3 is only the USB/WiFi bridge)
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    robotis-git/Dynamixel2Arduino
